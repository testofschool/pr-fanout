name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch GH Archive schema drift early

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      # Pinned: an unpinned linter turns a finished, untouched repository
      # red the day it ships a new rule.
      - run: pip install pytest==8.3.4 ruff==0.16.7
      - run: ruff check .
      - run: PYTHONPATH=src python -m pytest -q

  reproduce:
    # Re-collects the 2025-09-10 reference day from GH Archive with the SAME
    # sampling the published dataset used (--every 2 = 12 hours) and asserts an
    # exact match against data/day-2025-09-10.json.
    #
    # It previously ran --every 12. That is a STRIDE, not a count: it collected
    # 2 hours against the published 12, and asserted only that the archive
    # returned something. The job was green and proved nothing about the
    # published numbers. Measured 2026-09-14: the full 12-hour re-collection
    # takes 66s and matches all 11 summary fields exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=src python -m pr_fanout collect --date 2025-09-10 --every 2 --top 30 --out /tmp/repro.json
      - name: exact match against the published day
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, sys
          fresh = json.load(open("/tmp/repro.json"))
          pub = json.load(open("data/day-2025-09-10.json"))
          assert fresh["hours_collected"] == pub["hours_collected"], (
              "hour coverage differs: %s vs %s" % (fresh["hours_collected"], pub["hours_collected"]))
          assert fresh["all_hours_full_schema"], "archive schema changed - regenerate the dataset"
          diffs = [(k, fresh["summary"].get(k), v)
                   for k, v in pub["summary"].items() if fresh["summary"].get(k) != v]
          if diffs:
              for k, got, want in diffs:
                  print("MISMATCH %s: recollected=%r published=%r" % (k, got, want))
              sys.exit(1)
          assert fresh["repos_per_actor_histogram"] == pub["repos_per_actor_histogram"], "histogram drift"
          assert fresh["suppressed_rows"] == pub["suppressed_rows"], "suppression count drift"
          print("reproduced %d/%d summary fields + histogram + suppression, %d hours"
                % (len(pub["summary"]), len(pub["summary"]), fresh["hours_collected"]))
          PY
